<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KONKORD TV — Smart Entertainment System</title>
    <meta name="description" content="Sistema completo de Smart TV cinematográfico desenvolvido para televisões virtuais no Second Life, com central de música, vídeos, navegador e integração Konkord." />
    <meta property="og:title" content="KONKORD TV — Smart Entertainment System" />
    <meta property="og:description" content="Sistema completo de Smart TV cinematográfico desenvolvido para televisões virtuais no Second Life." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body, #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: #07090e;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" onerror="window.__konkordLoadDocsFallback && window.__konkordLoadDocsFallback()"></script>
    <!-- ROOT_STATIC_FALLBACK_START -->
    <script>
      (function () {
        function showFallbackMessage(detail) {
          var root = document.getElementById('root');
          if (!root || window.__KONKORD_MOUNTED_UI__) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#07090e;color:#f8fafc;text-align:center;">' +
            '<div style="max-width:520px;padding:28px;border-radius:16px;border:1px solid rgba(255,255,255,0.12);background:#10141e;">' +
            '<h1 style="margin:0 0 10px;font-size:20px;">KONKORD TV</h1>' +
            '<p style="margin:0;font-size:14px;line-height:1.6;color:#94a3b8;">' +
            detail +
            '</p></div></div>';
        }

        window.__konkordLoadDocsFallback = function () {
          if (window.__KONKORD_APP_LOADED__ || window.__KONKORD_FALLBACK_STARTED__) return;
          window.__KONKORD_FALLBACK_STARTED__ = true;

          var css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = './docs/assets/konkord-tv.css';
          document.head.appendChild(css);

          var js = document.createElement('script');
          js.type = 'module';
          js.src = './docs/assets/konkord-tv.js';
          js.onerror = function () {
            showFallbackMessage(
              'Não foi possível carregar os arquivos compilados em <strong>./docs/assets/</strong>. Verifique se a pasta <strong>docs</strong> foi enviada para o GitHub.'
            );
          };
          document.body.appendChild(js);
        };

        window.addEventListener('error', function (ev) {
          if (!window.__KONKORD_MOUNTED_UI__ && window.__KONKORD_FALLBACK_STARTED__) {
            showFallbackMessage('Erro ao iniciar a interface: ' + (ev && ev.message ? ev.message : 'erro de script'));
          }
        });

        setTimeout(function () {
          if (!window.__KONKORD_APP_LOADED__) {
            window.__konkordLoadDocsFallback();
          }
        }, 700);
      })();
    </script>
    <!-- ROOT_STATIC_FALLBACK_END -->
  </body>
</html>
